<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h1 >
        Form
    </h1>
    <form >
        <label for="name" > Name:</label><br>
        <input type="text" placeholder="Enter your Name" ><br><br>

        <label for="phone">Mobile number:</label><br>
        <input type="phone" placeholder="Enter mobile number"><br><br>

        <label for="date">DOB</label><br>
        <input type="date" placeholder="DOB"><br><br>   

        <label for="email"> Email:</label><br>
        <input type="email" placeholder="Enter your Email"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" placeholder="Enter your password"><br><br>

        <label for="gender">Gender</label><br><br>
        <input type="radio" placeholder="male">
        <label for="male">male</label><br>
        <input type="radio" placeholder="female">
        <label for="female">female</label><br>
        <input type="radio" placeholder="other">
        <label for="other">other</label><br><br>

        <label for="skills">Skills</label><br><br>
        <input type="checkbox" placeholder="HTML">
        <label for="HTML">HTML</label><br>
        <input type="checkbox" placeholder="CSS">
        <label for="CDD" >CSS</label><br>
        <input type="checkbox" placeholder="JS">
        <label for="JS">JS</label><br><br>

        <button type="submit">Register</button>



    </form>
</body>
</html>
